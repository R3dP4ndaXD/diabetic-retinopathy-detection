# Cluster-specific config for Slurm + Apptainer runs

# data: CSV files are stored in the project dir (generated on FEP with /data paths).
# Image paths inside the CSVs use /data/... (bind-mounted from DATASET_DIR at runtime).
train_csv_path: data/diabetic-retinopathy-dataset/train.csv
val_csv_path: data/diabetic-retinopathy-dataset/val.csv
test_csv_path: data/diabetic-retinopathy-dataset/test.csv

# experiment:
seed: 42
num_workers: 8
weight_decay: 1e-4
label_smoothing: 0.0
use_scheduler: true
loss_name: "cross_entropy"  # options: cross_entropy, focal
focal_gamma: 2.0
scheduler_monitor: "val_loss"
scheduler_monitor_mode: "min"
checkpoint_monitor: "val_kappa"
checkpoint_monitor_mode: "max"
early_stopping_monitor: "val_loss"
early_stopping_mode: "min"
tta_enabled: false
tta_runs: 5
precision: "bf16-mixed"
max_epochs: 35
# custom_mean/std are used only when normalization_mode="custom"
custom_mean: null
custom_std: null
warmup_epochs: 4
wavelet_name: "haar"
wavelet_mode: "symmetric"
wavelet_include_lowpass_channel: true


batch_size: 128
learning_rate: 8e-5
image_size: 260
model_name: "efficientnet-b2"  # options: efficientnet-b2, swin-v2-b, resnet50

use_wavelet_channel_input: false

balancing_mode: "naive_oversample"  # options: naive_oversample, sampler, weighted_loss
normalization_mode: "dataset_by_size"  # options: imagenet, dataset_by_size, custom
freeze_backbone: false

run_tag: "${model_name}_${balancing_mode}_ben2_torchvision" # used for naming checkpoints and logs

# output: Use project-local paths (will be bind-mounted in container)
logs_dir: logs
checkpoint_dirpath: artifacts/checkpoints