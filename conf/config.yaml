# ── Data ─────────────────────────────────────────────────────────────────────
train_csv_path: /data/train.csv
val_csv_path:   /data/val.csv
test_csv_path:  /data/test.csv

# ── Reproducibility ───────────────────────────────────────────────────────────
seed: 42

# ── I/O & logging ────────────────────────────────────────────────────────────
num_workers: 8
logs_dir: logs
checkpoint_dirpath: artifacts/checkpoints
run_tag: ""   # optional suffix appended to the auto-generated tag (e.g. "exp1")

# ── Model ────────────────────────────────────────────────────────────────────
model_name: "efficientnet_b2"   # See src/models/factory.py TIMM_MODEL_REGISTRY
drop_rate: 0.3
drop_path_rate: 0.2           # stochastic depth (ViTs and ConvNeXt benefit most)
layer_lr_decay: 0.75          # layer-wise LR decay ratio (ViT families only)
freeze_backbone: false

# ── Image & normalisation ────────────────────────────────────────────────────
image_size: null   # null → use model's recommended size (see TIMM_MODEL_REGISTRY)

# ── Training recipe ──────────────────────────────────────────────────────────
batch_size: 128
learning_rate: 8e-5
weight_decay: 1e-4
max_epochs: 50
precision: "bf16-mixed"
gradient_clip_val: 1.0
warmup_epochs: 4

# ── Loss ─────────────────────────────────────────────────────────────────────
loss_name: "cross_entropy"    # "cross_entropy" | "focal"
focal_gamma: 2.0
label_smoothing: 0.1

# ── MixUp / CutMix ───────────────────────────────────────────────────────────
use_mixup: true
mixup_alpha: 0.4
cutmix_alpha: 1.0
mixup_prob: 0.5

# ── Recipe checks (avoid conflicting techniques) ────────────────────────────
strict_compatibility_checks: true

# ── Class balancing ───────────────────────────────────────────────────────────
balancing_mode: "naive_oversample"   # "naive_oversample" | "sampler" | "weighted_loss" | "smote"

# ── Scheduler ────────────────────────────────────────────────────────────────
use_scheduler: true
scheduler_type: "warmup_cosine"   # "auto" | "warmup_cosine" | "plateau"
scheduler_monitor: "val_loss"
scheduler_monitor_mode: "min"

# ── Checkpointing & early stopping ───────────────────────────────────────────
checkpoint_monitor: "val_kappa"
checkpoint_monitor_mode: "max"
early_stopping_monitor: "val_loss"
early_stopping_mode: "min"

# ── TTA (test-time augmentation) ─────────────────────────────────────────────
tta_enabled: false
tta_runs: 5

# ── Frequency channel input: "none" | "wavelet" | "dct" | "fourier" | "fourier_hpf" ──
freq_transform: "none"

# wavelet options (freq_transform: "wavelet")
wavelet_name: "haar"
wavelet_mode: "symmetric"
wavelet_levels: 1
wavelet_include_lowpass_channel: true

# dct options (freq_transform: "dct")
dct_block_size: 8        # block side length (8 = JPEG standard)
dct_num_coeffs: 6        # zigzag-ordered coefficients to keep per block

# fourier options (freq_transform: "fourier")
fourier_shift: true
# fourier_hpf options (freq_transform: "fourier_hpf")
fourier_hpf_radius: 0.1

# ── Monte Carlo Dropout (uncertainty quantification at test time) ─────────────
mc_dropout_enabled: false      # run N stochastic forward passes at test time
mc_dropout_samples: 50         # number of MC passes (50 is standard in literature)

# ── Multi-GPU (DDP) ──────────────────────────────────────────────────────────
num_gpus: 1   # 1–3 for cluster

# ── OOF training ─────────────────────────────────────────────────────────────
oof_source_csv_path: /data/train.csv  # null -> train_csv_path
oof_num_folds: 5
oof_seed: 42
oof_output_dir: artifacts/oof
