# ── Data ─────────────────────────────────────────────────────────────────────
train_csv_path: data/diabetic-retinopathy-dataset/train.csv
val_csv_path:   data/diabetic-retinopathy-dataset/val.csv
test_csv_path:  data/diabetic-retinopathy-dataset/test.csv

# ── Reproducibility ───────────────────────────────────────────────────────────
seed: 42

# ── I/O & logging ────────────────────────────────────────────────────────────
num_workers: 8
logs_dir: logs
checkpoint_dirpath: artifacts/checkpoints
run_tag: "${model_name}_${balancing_mode}"

# ── Model ────────────────────────────────────────────────────────────────────
model_name: "convnext_base"   # See src/models/factory.py TIMM_MODEL_REGISTRY
model_source: "timm"          # kept for reference; factory is now always timm
drop_rate: 0.3
drop_path_rate: 0.2           # stochastic depth (ViTs and ConvNeXt benefit most)
layer_lr_decay: 0.75          # layer-wise LR decay ratio (ViT families only)
freeze_backbone: false

# ── Image & normalisation ────────────────────────────────────────────────────
image_size: 224
normalization_mode: "timm"    # "timm" | "imagenet" | "dataset_by_size" | "custom"
custom_mean: null             # used only when normalization_mode="custom"
custom_std: null

# ── Training recipe ──────────────────────────────────────────────────────────
batch_size: 64
learning_rate: 8e-5
weight_decay: 1e-4
max_epochs: 35
precision: "bf16-mixed"
gradient_clip_val: 1.0
warmup_epochs: 4

# ── EMA ──────────────────────────────────────────────────────────────────────
use_ema: true
ema_decay: 0.9998

# ── Loss ─────────────────────────────────────────────────────────────────────
loss_name: "cross_entropy"    # "cross_entropy" | "focal"
focal_gamma: 2.0
label_smoothing: 0.1

# ── MixUp / CutMix ───────────────────────────────────────────────────────────
use_mixup: true
mixup_alpha: 0.4
cutmix_alpha: 1.0
mixup_prob: 0.5

# ── Class balancing ───────────────────────────────────────────────────────────
balancing_mode: "naive_oversample"   # "naive_oversample" | "sampler" | "weighted_loss"

# ── Scheduler ────────────────────────────────────────────────────────────────
use_scheduler: true
scheduler_monitor: "val_loss"
scheduler_monitor_mode: "min"

# ── Checkpointing & early stopping ───────────────────────────────────────────
checkpoint_monitor: "val_kappa"
checkpoint_monitor_mode: "max"
early_stopping_monitor: "val_loss"
early_stopping_mode: "min"

# ── TTA (test-time augmentation) ─────────────────────────────────────────────
tta_enabled: false
tta_runs: 5

# ── Wavelet channel input (single-stream only) ────────────────────────────────
use_wavelet_channel_input: false
wavelet_name: "haar"
wavelet_mode: "symmetric"
wavelet_levels: 1
wavelet_include_lowpass_channel: true

# ── Multi-GPU (DDP) ──────────────────────────────────────────────────────────
num_gpus: 1    # 1–3 for H100 cluster
