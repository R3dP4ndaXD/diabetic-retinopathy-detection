# Dual-stream training configuration
# Inherits the same structure as config.yaml but with dual-stream-specific defaults.

# ── Data ─────────────────────────────────────────────────────────────────────
train_csv_path: data/diabetic-retinopathy-dataset/train.csv
val_csv_path:   data/diabetic-retinopathy-dataset/val.csv
test_csv_path:  data/diabetic-retinopathy-dataset/test.csv

# ── Reproducibility ───────────────────────────────────────────────────────────
seed: 42

# ── I/O & logging ────────────────────────────────────────────────────────────
num_workers: 8
logs_dir: logs
checkpoint_dirpath: artifacts/checkpoints
run_tag: "${rgb_model_name}_${wav_model_name}_${fusion_type}_dual_no_randaug"

# ── Dual-stream backbone names ────────────────────────────────────────────────
rgb_model_name: "coatnet_2"     # heavy backbone for RGB stream
wav_model_name: "convnext_base"   # lightweight backbone for wavelet stream

# ── Fusion ────────────────────────────────────────────────────────────────────
fusion_type: "mlp"           # "mlp" | "cross_attention"
fusion_hidden: 512
fusion_dropout: 0.3
fusion_num_heads: 8          # only used when fusion_type="cross_attention"

# ── Wavelet stream ────────────────────────────────────────────────────────────
wavelet_name: "sym2"         # symlet-2; outperforms haar on DR per literature
wavelet_mode: "symmetric"
wavelet_levels: 2            # J=2 decomposition (LL + LH/HL/HH at 2 scales)
wavelet_include_lowpass_channel: true   # include LL channel as input to wavelet stream

# ── Image & normalisation ────────────────────────────────────────────────────
image_size: 224
normalization_mode: "timm"   # uses rgb_model_name's data_config

# ── Training recipe ──────────────────────────────────────────────────────────
batch_size: 64               # lower than single-stream (two forward passes)
learning_rate: 5e-5
weight_decay: 1e-4
max_epochs: 50
precision: "bf16-mixed"
gradient_clip_val: 1.0
warmup_epochs: 4

# ── Backbone regularisation ───────────────────────────────────────────────────
drop_rate: 0.3
drop_path_rate: 0.2
freeze_backbone: false

# ── EMA ──────────────────────────────────────────────────────────────────────
use_ema: false
ema_decay: 0.9998

# ── Loss ─────────────────────────────────────────────────────────────────────
loss_name: "cross_entropy"
focal_gamma: 2.0
label_smoothing: 0.1

# ── MixUp / CutMix ───────────────────────────────────────────────────────────
use_mixup: true
mixup_alpha: 0.4
cutmix_alpha: 1.0
mixup_prob: 0.5

# ── Class balancing ───────────────────────────────────────────────────────────
balancing_mode: "naive_oversample"

# ── Scheduler ────────────────────────────────────────────────────────────────
use_scheduler: true
scheduler_monitor: "val_loss"
scheduler_monitor_mode: "min"

# ── Checkpointing & early stopping ───────────────────────────────────────────
checkpoint_monitor: "val_kappa"
checkpoint_monitor_mode: "max"
early_stopping_monitor: "val_loss"
early_stopping_mode: "min"

# ── TTA ──────────────────────────────────────────────────────────────────────
tta_enabled: false
tta_runs: 5

# ── Multi-GPU ─────────────────────────────────────────────────────────────────
num_gpus: 1
