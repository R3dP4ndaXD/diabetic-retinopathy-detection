# Dual-stream training configuration
# Inherits the same structure as config.yaml but with dual-stream-specific defaults.

# ── Data ─────────────────────────────────────────────────────────────────────
train_csv_path: data/diabetic-retinopathy-dataset/train.csv
val_csv_path:   data/diabetic-retinopathy-dataset/val.csv
test_csv_path:  data/diabetic-retinopathy-dataset/test.csv

# ── Reproducibility ───────────────────────────────────────────────────────────
seed: 42

# ── I/O & logging ────────────────────────────────────────────────────────────
num_workers: 8
logs_dir: logs
checkpoint_dirpath: artifacts/checkpoints
run_tag: "${rgb_model_name}_${wav_model_name}_${fusion_type}_${freq_stream}"

# ── Dual-stream backbone names ────────────────────────────────────────────────
rgb_model_name: "efficientnet_b2"     # heavy backbone for RGB stream
wav_model_name: "efficientnet_b2"   # lightweight backbone for wavelet stream

# ── Fusion ────────────────────────────────────────────────────────────────────
fusion_type: "mlp"           # "mlp" | "cross_attention"
fusion_hidden: 512
fusion_dropout: 0.3
fusion_num_heads: 8          # only used when fusion_type="cross_attention"

# ── Frequency stream: "wavelet" | "dct" | "fourier" | "fourier_hpf" ─────────
freq_stream: "dwt"
# wavelet options (freq_stream: "wavelet")
wavelet_name: "haar"
wavelet_mode: "symmetric"
wavelet_levels: 1
wavelet_include_lowpass_channel: true
# dct options (freq_stream: "dct")
dct_block_size: 8
dct_num_coeffs: 6
# fourier options (freq_stream: "fourier")
#   3 k-space channels: sign(Re)*log1p|Re|, sign(Im)*log1p|Im|, log1p|F|
fourier_shift: true
# fourier_hpf options (freq_stream: "fourier_hpf")
#   FFT → zero-out low-freq circle → IFFT → pixel-space edges/vessels
#   lpf_radius: fraction of min(H,W) to suppress around DC (0.05–0.25)
#   grayscale: true → 1 output channel; false → 3 per-channel outputs
fourier_hpf_radius: 0.1
fourier_hpf_grayscale: false

# ── Image & normalisation ────────────────────────────────────────────────────
image_size: 260
normalization_mode: "timm"   # uses rgb_model_name's data_config

# ── Training recipe ──────────────────────────────────────────────────────────
batch_size: 64               # lower than single-stream (two forward passes)
learning_rate: 5e-5
weight_decay: 1e-4
max_epochs: 50
precision: "bf16-mixed"
gradient_clip_val: 1.0
warmup_epochs: 4

# ── Backbone regularisation ───────────────────────────────────────────────────
drop_rate: 0.3
drop_path_rate: 0.2
freeze_backbone: false

# ── EMA ──────────────────────────────────────────────────────────────────────
use_ema: false
ema_decay: 0.9998

# ── Loss ─────────────────────────────────────────────────────────────────────
loss_name: "cross_entropy"
focal_gamma: 2.0
label_smoothing: 0.1

# ── MixUp / CutMix ───────────────────────────────────────────────────────────
use_mixup: true   # incompatible with SupCon
mixup_alpha: 0.4
cutmix_alpha: 1.0
mixup_prob: 0.5

# ── Class balancing ───────────────────────────────────────────────────────────
balancing_mode: "naive_oversample"

# ── Scheduler ────────────────────────────────────────────────────────────────
use_scheduler: true
scheduler_monitor: "val_loss"
scheduler_monitor_mode: "min"

# ── Checkpointing & early stopping ───────────────────────────────────────────
checkpoint_monitor: "val_kappa"
checkpoint_monitor_mode: "max"
early_stopping_monitor: "val_loss"
early_stopping_mode: "min"

# ── TTA ──────────────────────────────────────────────────────────────────────
tta_enabled: false
tta_runs: 5

# ── Supervised Contrastive Learning ──────────────────────────────────────────
# Dual-stream SupCon is free: f_rgb and f_wav are natural positive pairs.
use_supcon: false
supcon_weight: 0.2
supcon_temperature: 0.07
supcon_ordinal: true

# ── Multi-GPU ─────────────────────────────────────────────────────────────────
num_gpus: 1
